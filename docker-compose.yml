# Full architecture on one machine:
#
#   browser -> nginx (load balancer) -> backend-1 / backend-2 / backend-3
#                                           |            |
#                                     redis (cache)   MongoDB Atlas (pooled connections)
#
# Requires backend/.env with MONGODB_URI set. Start with:
#   docker compose up --build
# Then open http://localhost:8080

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  restart: unless-stopped
  depends_on:
    - redis

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 4000
  HOST: 0.0.0.0
  REDIS_URL: redis://redis:6379

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3

  frontend:
    build: ./frontend
    restart: unless-stopped

  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-3

  redis:
    image: redis:8-alpine
    # Pure cache: cap memory and evict the least recently used keys when full.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    restart: unless-stopped
