worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # The backend pool. To add a server: add a line here and a matching
  # service in docker-compose.yml.
  upstream backend_pool {
    # Send each request to the server with the fewest active requests.
    least_conn;

    # A server that fails 3 times is taken out of rotation for 10 seconds.
    server backend-1:4000 max_fails=3 fail_timeout=10s;
    server backend-2:4000 max_fails=3 fail_timeout=10s;
    server backend-3:4000 max_fails=3 fail_timeout=10s;

    # Reuse connections to the backends instead of opening one per request.
    keepalive 64;
  }

  upstream frontend_app {
    server frontend:3000;
    keepalive 16;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /api/ {
      proxy_pass http://backend_pool;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      # If one server is down or erroring, retry the request on another one.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location = /health {
      proxy_pass http://backend_pool;
    }

    location / {
      proxy_pass http://frontend_app;
    }
  }
}
